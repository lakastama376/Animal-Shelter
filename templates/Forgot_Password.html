<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='Styles/auth-style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='Assets/Images/logo-icon.png') }}" type="image/png">
</head>
<body>
    <!--Tabs-->
    <main class="auth-page_container">
        <div class="auth-card">
            <div class="auth-tabs">
                <a href="{{ url_for('login') }}" class="tab-item">Sign In</a>
                <a href="{{ url_for('signup') }}" class="tab-item">Register</a>
            </div>
            <div class="auth-body">
                <div class="brand-icon-container">
                    <div class="brand-circle">
                        <i class="fa-solid fa-paw"></i>
                    </div>
                </div>

                <!--Reset Password Form-->
                <div class="login-form-container" id="reset-password-view">
                    <div class="login-form">
                        <h2>Reset Password</h2>
                        <p class="subtitle">Enter your email address to recover your account</p>
                        <form class="auth-form-vertical" onsubmit="event.preventDefault();">
                            <div class="input-group">
                                <label for="email-forgot-password">Email Address</label>
                                <input type="email" id="email-forgot-password" name="email" placeholder="Enter Your Email" required>
                                <div id="email-error-message" class="error-msg"></div>
                            </div>
                            <button type="submit" id="forgot-password-btn" class="login-btn">Submit</button>
                        </form>
                    </div>
                    <div class="signup-link-container" style="margin-top: 24px;">
                        <a href="{{ url_for('login') }}" id="back-to-login-btn" style="font-weight: 500;">
                            <i class="fa-solid fa-arrow-left-long"></i> &nbsp;Back to Login
                        </a>
                    </div>
                </div>
                <div id="reset-password-confirmation-page" style="display: none; text-align: center;">
                    <h2 style="color: #0b1a30; margin-bottom: 12px;">Password Reset Email Sent</h2>
                    <p class="subtitle" style="margin-bottom: 32px; line-height: 1.6;">
                        Please check your email for instructions on how to reset your password.
                    </p>
                    <div class="signup-link-container">
                        <a href="{{ url_for('login') }}" class="login-btn" style="color: white; text-decoration: none; display: inline-flex;">
                            Return to Login page
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>
    <script src="{{ url_for('static', filename='login-auth.js') }}" type="module"></script>
    <script src="{{ url_for('static', filename='scripts.js') }}" type="module"></script>
</body>
</html>
