<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='Styles/default.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='Styles/auth-style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='Assets/Images/logo-icon.png') }}" type="image/png">
</head>
<body>
    <!--Tabs-->
    <main class="auth-page_container">
        <div class="auth-card">
            <div class="auth-tabs">
                <a href="{{ url_for('login') }}" class="tab-item active">Sign In</a>
                <a href="{{ url_for('signup') }}" class="tab-item">Register</a>
            </div>
            <div class="auth-body">
                <div class="brand-icon-container">
                    <div class="brand-circle">
                        <img class="logo-img-card" src="{{ url_for('static', filename='Assets/Images/logo.png') }}" alt="Tails of Freedom Logo" />
                    </div>
                </div>
                <h2>Welcome Back</h2>
                <p class="subtitle">Sign in to your account</p>

                <!--Login Form-->
                <form class="auth-form-vertical">
                    <div class="input-group">
                        <label for="email-input">Email Address</label>
                        <input type="text" id="email-input" name="email" placeholder="Email or Username" required>
                        <div id="email-error-message" class="error-msg"></div>
                    </div>
                    <div class="input-group password-wrapper">
                        <label for="password-input">Password</label>
                        <div class="input-with-icon">
                            <input type="password" id="password-input" name="password" placeholder="Password" required>
                            <i class="fa-regular fa-eye toggle-password"></i>
                        </div>
                        <div id="password-error-message" class="error-msg"></div>
                    </div>
                    <div class="form-utilities">
                        <label class="remember-me">
                            <input type="checkbox" name="remember_me">
                            <span>Remember me</span>
                        </label>
                        <a href="{{ url_for('reset_password') }}" class="forgot-link">Forgot password?</a>
                    </div>
                    <button type="submit" id="sign-in-btn" class="login-btn">
                        Sign In &nbsp;<i class="fa-solid fa-arrow-right-long"></i>
                    </button>
                </form>
                <div class="alt-signin-divider">
                    <span>Sign In with</span>
                </div>
                <div class="social-login-row">
                    <button id="sign-in-with-google-btn" class="social-btn">
                        <img src="{{ url_for('static', filename='Assets/Images/google-icon.png') }}" alt="Google" class="social-icon">
                        Google
                    </button>
                    <button id="sign-in-with-facebook-btn" class="social-btn">
                        <i class="fa-brands fa-facebook facebook-icon" style="color: #1877F2; font-size: 18px;"></i>
                        Facebook
                    </button>
                </div>
                <div id="google-signin-error-message" class="error-msg"></div>
                <div class="signup-link-container">
                    Don't have an account? <a href="{{ url_for('signup') }}">Create new account</a>
                </div>
            </div>
        </div>
    </main>
    <script src="{{ url_for('static', filename='login-auth.js') }}" type="module"></script>
</body>
</html>
